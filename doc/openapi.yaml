openapi: 3.0.3
info:
  title: C2C Flea Market API
  version: 1.0.0
  description: C2C二手跳蚤市场RESTful API规范文档，遵循OpenAPI 3.0标准规范。
servers:
  - url: http://localhost:3000/api
    description: 本地开发环境

tags:
  - name: Auth
    description: 用户注册与登录认证
  - name: Users
    description: 用户资料与个人信息管理
  - name: Products
    description: 商品出品、检索、修改与下架
  - name: Categories
    description: 商品分类层级查询
  - name: Tags
    description: 商品标签查询
  - name: Upload
    description: 媒体与商品图片上传

paths:
  /auth/signup:
    post:
      tags:
        - Auth
      summary: 用户注册
      operationId: signupUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: 密码格式不符或邮箱已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并签发JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - Users
      summary: 获取当前登录用户资料
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 成功获取个人资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: 未登录或Token无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Users
      summary: 更新当前用户资料
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 个人资料更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /products:
    get:
      tags:
        - Products
      summary: 检索在售商品列表
      parameters:
        - name: categoryId
          in: query
          description: 分类UUID
          schema:
            type: string
        - name: keyword
          in: query
          description: 标题搜索关键词
          schema:
            type: string
        - name: minPrice
          in: query
          description: 最低价格
          schema:
            type: number
        - name: maxPrice
          in: query
          description: 最高价格
          schema:
            type: number
      responses:
        '200':
          description: 获取商品列表成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
    post:
      tags:
        - Products
      summary: 发布新商品 (出品)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: 商品发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
        '400':
          description: 必填项缺失或价格无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}:
    get:
      tags:
        - Products
      summary: 获取商品详情
      parameters:
        - name: id
          in: path
          required: true
          description: 商品UUID
          schema:
            type: string
      responses:
        '200':
          description: 获取详情成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
        '404':
          description: 商品不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Products
      summary: 更新商品信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 商品UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
        '403':
          description: 无权修改他人商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Products
      summary: 下架商品 (软删除)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 商品UUID
          schema:
            type: string
      responses:
        '200':
          description: 下架成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProductResponse'
        '403':
          description: 无权下架他人商品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      tags:
        - Categories
      summary: 获取商品分类列表/树
      responses:
        '200':
          description: 获取分类列表成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /tags:
    get:
      tags:
        - Tags
      summary: 获取可用标签列表
      responses:
        '200':
          description: 获取标签列表成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'

  /upload:
    post:
      tags:
        - Upload
      summary: 上传图片文件
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传的图片文件 (JPG, PNG, WebP)
      responses:
        '201':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 24
        username:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            username:
              type: string

    UserProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            username:
              type: string
            phone:
              type: string
            address:
              type: string
            bio:
              type: string

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        phone:
          type: string
        address:
          type: string
        bio:
          type: string

    CreateProductRequest:
      type: object
      required:
        - title
        - description
        - price
        - categoryId
        - imageUrls
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        categoryId:
          type: string
        tagIds:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string

    UpdateProductRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        categoryId:
          type: string
        tagIds:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string

    CreateProductResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        product:
          $ref: '#/components/schemas/Product'

    DeleteProductResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        product:
          type: object
          properties:
            id:
              type: string
            status:
              type: string

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'

    ProductDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Product'

    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: string
        status:
          type: string
          enum: [LISTED, RESERVED, SOLD, HIDDEN]
        createdAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        parentId:
          type: string

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    UploadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        url:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
